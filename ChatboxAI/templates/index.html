<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rocky AI – Your intelligent AI chat assistant.">
    <title>Rocky AI</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Page Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">

    <!-- Markdown renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<!-- ── Header ────────────────────────────────────────────────── -->
<header class="header" role="banner">
    <div class="logo">
        <div class="logo-icon" aria-hidden="true">🤖</div>
        <span class="logo-text">Rocky AI</span>
        <span class="logo-badge">Beta</span>
    </div>

    <div class="header-right">
        <!-- Signed-in user session info -->
        <div class="user-session">
            <span class="user-greeting">Hi,&nbsp;<strong class="user-name-badge">{{ user_name }}</strong></span>
            <a href="/logout" class="btn-logout" id="logoutBtn">Logout</a>
        </div>

        <!-- Theme toggle -->
        <div class="theme-toggle" onclick="cycleTheme()" title="Toggle theme" role="group" aria-label="Theme switcher">
            <button class="theme-toggle-btn" id="btn-dark"  title="Dark mode"  aria-pressed="true">🌙</button>
            <button class="theme-toggle-btn" id="btn-light" title="Light mode" aria-pressed="false">☀️</button>
        </div>
    </div>
</header>

<!-- ── Chat Area ─────────────────────────────────────────────── -->
<div class="chat-wrapper">
    <main id="chatbox" class="chat-container" role="log" aria-label="Chat messages" aria-live="polite">
        <div class="welcome" id="welcome">
            <div class="welcome-icon" aria-hidden="true">🤖</div>
            <h2>Hey, I'm Rocky</h2>
            <p>Ask me anything — I'm here to help you think, create, and explore.</p>
        </div>
    </main>
</div>

<!-- ── Input Area ─────────────────────────────────────────────── -->
<footer class="input-area" role="contentinfo">
    <div class="input-box">
        <textarea
            id="userInput"
            placeholder="Message Rocky…"
            rows="1"
            aria-label="Message input"
            autocomplete="off">
        </textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send message" aria-label="Send message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
        </button>
    </div>
    <p class="input-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</p>
</footer>

<!-- Page Script -->
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
